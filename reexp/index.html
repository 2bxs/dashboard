<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Consulta de documentos — SVE ZOFRI</title>
<style>
  :root {
    --bg: rgb(52, 52, 50);
    --card: rgb(62, 62, 60);
    --line: rgb(252, 75, 8);
    --text: #f4f4f2;
    --muted: #c2c2bd;
    --naranja: rgb(252, 75, 8);
    --rojo: #d92d20;
    --verde: #039855;
    --gris: #c2c2bd;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 28px 18px 60px;
  }
  .contenedor { max-width: 1050px; margin: 0 auto; }
  header { margin-bottom: 22px; }
  h1 { margin: 0 0 6px; font-size: 26px; }
  header p { margin: 0; color: var(--muted); font-size: 14px; }
  .tarjeta {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 20px 22px;
    margin-bottom: 18px;
    box-shadow: 0 2px 10px rgba(0,0,0,.28);
  }
  .tarjeta h2 { margin: 0 0 14px; font-size: 16px; }
  .fila { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end; }
  .campo { display: flex; flex-direction: column; gap: 6px; flex: 1 1 200px; }
  .campo label { font-size: 12px; font-weight: 600; color: var(--muted); }
  input, textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font: inherit;
    font-size: 14px;
    color: var(--text);
    background: rgb(42, 42, 40);
  }
  input::placeholder, textarea::placeholder { color: #8d8d88; }
  textarea { min-height: 130px; resize: vertical; font-family: Consolas, "Courier New", monospace; line-height: 1.5; }
  input:focus, textarea:focus { outline: 2px solid rgba(252,75,8,.45); border-color: var(--naranja); }
  button {
    border: 1px solid var(--naranja);
    border-radius: 8px;
    padding: 11px 18px;
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    color: #fff;
    background: var(--naranja);
  }
  button:hover { filter: brightness(1.1); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.secundario { background: transparent; color: var(--naranja); }
  .estado {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: rgba(255,255,255,.05);
    color: var(--muted);
  }
  .estado.on { color: #6ee7a8; border-color: #039855; }
  .punto { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .aviso { margin-top: 12px; font-size: 13px; min-height: 18px; }
  .aviso.error { color: var(--rojo); }
  .aviso.ok { color: var(--verde); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  th { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  tr:hover td { background: rgba(255,255,255,.04); }
  .badge { padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; white-space: nowrap; }
  .b-rojo { background: rgba(217,45,32,.22); color: #ff9b91; }
  .b-naranja { background: rgba(252,75,8,.2); color: #ffb27f; }
  .b-verde { background: rgba(3,152,85,.22); color: #6ee7a8; }
  .b-gris { background: rgba(255,255,255,.07); color: var(--gris); }
  .resumen { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
  .chip { background: rgba(255,255,255,.07); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; font-size: 13px; }
  .chip b { margin-left: 6px; }
  .vacio { color: var(--muted); font-size: 14px; padding: 18px 0; }
  .barra { display: flex; gap: 10px; align-items: center; margin-top: 16px; }
  .nota { font-size: 12px; color: var(--muted); margin-top: 10px; }
  .oculto { display: none; }
</style>
</head>
<body>
<div class="contenedor">
  <header>
    <h1>Consulta de documentos · SVE ZOFRI</h1>
    <p>Revisa en lote si un código <b>xxx-xx-xxxxxx</b> ya fue controlado en Control de Tránsito.</p>
  </header>

  <section class="tarjeta">
    <h2>1. Sesión</h2>
    <div class="fila">
      <div class="campo"><label>Usuario del SVE</label><input id="usuario" autocomplete="username" placeholder="tu.usuario"></div>
      <div class="campo"><label>Contraseña</label><input id="clave" type="password" autocomplete="current-password" placeholder="••••••••"></div>
      <button id="btn-sesion">Iniciar sesión</button>
    </div>
    <div class="barra">
      <span id="estado-sesion" class="estado"><span class="punto"></span><span id="texto-sesion">Sin sesión</span></span>
    </div>
    <div id="nota-sesion" class="nota oculto"></div>
    <div id="aviso-sesion" class="aviso"></div>
  </section>

  <section class="tarjeta">
    <h2>2. Códigos a revisar</h2>
    <textarea id="codigos" placeholder="201-26-477270&#10;201-26-477271&#10;201262477272"></textarea>
    <div class="barra">
      <button id="btn-consultar" disabled>Consultar documentos</button>
      <button id="btn-importar" class="secundario">importar reexpediciones</button>
      <input id="archivo-pdf" type="file" accept="application/pdf,.pdf" multiple class="oculto">
      <span class="nota">Uno por línea, separados por coma o sin guiones. Máximo recomendado: 200 por tanda.</span>
    </div>
    <div id="aviso-consulta" class="aviso"></div>
  </section>

  <section class="tarjeta">
    <h2>3. Resultados</h2>
    <div id="resumen" class="resumen oculto"></div>
    <div id="tabla-contenedor" class="vacio">Aún no hay consultas.</div>
    <div class="barra">
      <button id="btn-csv" class="secundario disabled oculto">Descargar CSV</button>
    </div>
  </section>
</div>

<script>
const $ = (s) => document.querySelector(s);
let resultados = [];

async function api(url, body) {
  const opciones = body === undefined ? {} : {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  };
  const respuesta = await fetch(url, opciones);
  const datos = await respuesta.json();
  if (!respuesta.ok) throw new Error(datos.error || 'Error inesperado');
  return datos;
}

function mostrarSesion(datos) {
  const activa = !!datos.activa;
  $('#estado-sesion').classList.toggle('on', activa);
  $('#texto-sesion').textContent = activa ? `Conectado: ${datos.usuario}` : 'Sin sesión';
  $('#btn-consultar').disabled = !activa;
}

async function comprobarEstado() {
  try { mostrarSesion(await api('/api/estado')); } catch (e) { /* servidor iniciando */ }
}

$('#btn-sesion').addEventListener('click', async () => {
  const aviso = $('#aviso-sesion');
  aviso.className = 'aviso';
  aviso.textContent = 'Conectando...';
  $('#btn-sesion').disabled = true;
  try {
    const datos = await api('/api/sesion', {
      usuario: $('#usuario').value.trim(),
      clave: $('#clave').value
    });
    mostrarSesion(datos);
    $('#clave').value = '';
    aviso.className = 'aviso ok';
    aviso.textContent = 'Sesión iniciada correctamente.';
  } catch (e) {
    aviso.className = 'aviso error';
    aviso.textContent = e.message;
  } finally {
    $('#btn-sesion').disabled = false;
  }
});

$('#btn-consultar').addEventListener('click', async () => {
  const aviso = $('#aviso-consulta');
  const codigos = $('#codigos').value.split(/[\s,;]+/).map(s => s.trim()).filter(Boolean);
  if (!codigos.length) {
    aviso.className = 'aviso error';
    aviso.textContent = 'Pega al menos un código.';
    return;
  }
  aviso.className = 'aviso';
  aviso.textContent = `Consultando ${codigos.length} código(s)...`;
  $('#btn-consultar').disabled = true;
  try {
    const datos = await api('/api/consultar', { codigos });
    resultados = datos.resultados;
    pintar();
    aviso.className = 'aviso ok';
    aviso.textContent = 'Consulta terminada.';
  } catch (e) {
    aviso.className = 'aviso error';
    aviso.textContent = e.message;
  } finally {
    $('#btn-consultar').disabled = false;
  }
});

$('#btn-importar').addEventListener('click', () => $('#archivo-pdf').click());

$('#archivo-pdf').addEventListener('change', async (evento) => {
  const archivos = Array.from(evento.target.files);
  if (!archivos.length) return;
  const aviso = $('#aviso-consulta');
  aviso.className = 'aviso';
  aviso.textContent = `Leyendo ${archivos.length} PDF(s), esperá...`;
  $('#btn-importar').disabled = true;
  try {
    const formulario = new FormData();
    archivos.forEach(archivo => formulario.append('archivos', archivo));
    const respuesta = await fetch('/api/importar-pdf', { method: 'POST', body: formulario });
    const datos = await respuesta.json();
    if (!respuesta.ok) throw new Error(datos.error || 'Error al importar el PDF.');

    const area = $('#codigos');
    const actuales = area.value.split(/[\s,;]+/).map(s => s.trim()).filter(Boolean);
    const nuevos = datos.codigos.filter(c => !actuales.includes(c));
    if (nuevos.length) area.value = [...actuales, ...nuevos].join('\n');

    const detalle = datos.archivos.map(a => a.error
      ? `${a.nombre}: ${a.error}`
      : `${a.nombre}: ${a.codigos.length} código(s)`).join(' · ');
    aviso.className = nuevos.length ? 'aviso ok' : 'aviso';
    aviso.textContent = `${datos.codigos.length} reexpedición(es) encontrada(s), ${nuevos.length} agregada(s). ${detalle}`;
  } catch (error) {
    aviso.className = 'aviso error';
    aviso.textContent = error.message;
  } finally {
    $('#btn-importar').disabled = false;
    evento.target.value = '';
  }
});

function claseEstado(estado) {
  if (estado === 'CONTROLADO') return 'b-rojo';
  if (estado === 'NO CONTROLABLE') return 'b-naranja';
  if (estado === 'NO CONTROLADO') return 'b-verde';
  return 'b-gris';
}

function pintar() {
  const conteo = {};
  resultados.forEach(r => { conteo[r.estado] = (conteo[r.estado] || 0) + 1; });
  const resumen = $('#resumen');
  resumen.innerHTML = Object.entries(conteo)
    .map(([estado, n]) => `<span class="chip">${estado}<b>${n}</b></span>`).join('');
  resumen.classList.remove('oculto');

  const filas = resultados.map(r => `
    <tr>
      <td><b>${r.documento}</b></td>
      <td><span class="badge ${claseEstado(r.estado)}">${r.estado}</span></td>
      <td>${r.mensaje || '—'}</td>
    </tr>`).join('');
  $('#tabla-contenedor').className = '';
  $('#tabla-contenedor').innerHTML =
    '<table><thead><tr><th>Documento</th><th>Estado</th><th>Mensaje de la web</th></tr></thead>' +
    '<tbody>' + filas + '</tbody></table>';
  $('#btn-csv').classList.remove('oculto');
}

$('#btn-csv').addEventListener('click', () => {
  const columnas = ['documento', 'estado', 'mensaje'];
  const esc = (v) => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const lineas = [columnas.join(';')]
    .concat(resultados.map(r => columnas.map(c => esc(r[c])).join(';')));
  const blob = new Blob(['\ufeff' + lineas.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'resultados_sve.csv';
  a.click();
  URL.revokeObjectURL(a.href);
});

(async () => {
  try {
    const cfg = await api('/api/config');
    if (cfg.usuario) $('#usuario').value = cfg.usuario;
    if (cfg.autologin) {
      const nota = $('#nota-sesion');
      nota.textContent = 'El servidor ya tiene las credenciales configuradas: podés dejar la contraseña vacía y clic en Iniciar sesión.';
      nota.classList.remove('oculto');
    }
  } catch (e) { /* servidor iniciando */ }
  comprobarEstado();
})();
setInterval(comprobarEstado, 30000);
</script>
</body>
</html>
